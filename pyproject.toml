[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-ecs-diagnostics"
version = "0.1.0"
description = "ECS SRE diagnostic and recommendation engine — collect, correlate, diagnose, recommend. Never remediate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["aws", "ecs", "sre", "diagnostics", "prometheus", "splunk", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
# The engine, rules, reports, and the Prometheus/Splunk clients are stdlib-only.
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.28"]        # required only for live AWS collection
yaml = ["pyyaml>=6.0"]       # required only for YAML config files (JSON works without it)

[project.scripts]
sre = "ecs_diag.cli:main"

[tool.setuptools.packages.find]
include = ["ecs_diag*"]

[tool.setuptools.package-data]
ecs_diag = ["py.typed"]
